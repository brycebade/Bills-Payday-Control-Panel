
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Bills Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Bills Tracker</h1>

  <!-- Paycheck / Summary -->
  <section id="summary">
    <h2>Paycheck Summary</h2>

    <label>
      Paycheck Amount: $
      <input type="number" id="paycheck-input" />
    </label>
    <button id="set-paycheck">Set Paycheck</button>

    <label>
      Shared per check: $
      <input type="number" id="shared-input" value="600" />
    </label>

    <label>
      Savings per check: $
      <input type="number" id="savings-input" value="200" />
    </label>

    <p id="total-bills">Total Bills: $0.00</p>
    <p id="total-paid">Total Paid: $0.00</p>
    <p id="total-paid-shared">Shared Account: $0.00</p>
    <p id="total-paid-savings">Savings Account: $0.00</p>
    <p id="remaining">Remaining: $0.00</p>

    <label>
        Bills Due Between: 
        <input type="date" id="bills-start">
        <input type="date" id="bills-end">
    </label>
  </section>

  <!-- Bills Table -->
  <section id="bills-list">
    <h2>My Bills</h2>

    <table class="table">
      <thead>
        <tr>
          <th>Paid</th>
          <th>Bill Name</th>
          <th>Amount Due</th>
          <th>Due Date</th>
          <th>Amount Paid</th>
          <th>Payments Remaining</th>
        </tr>
      </thead>
      <tbody id="bills-tbody">
        <!-- rows will be added with JS -->
      </tbody>
    </table>
  </section>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>

</html>
